name: Apply 148 patch

on:
  push:
    branches: [fix/148-real-source-freshness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/148-real-source-freshness
      - run: python .tmp/apply_148_patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/rules/engine.py
          git diff --cached --quiet || git commit -m "fix: consume persisted freshness in rule engine"
          git push
