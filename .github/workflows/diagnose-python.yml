name: Python diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  ruff-isolation:
    name: active-${{ matrix.rules }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rules: [E, F, I, B, UP, S, RUF]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: >-
          ruff check tests/test_amazon_contract_verification.py
          --select "${{ matrix.rules }}"
          --ignore S101,S105,S106,S311,S608,B904,UP017,UP035,UP037,UP042,RUF100,E501

  pytest-diagnostic:
    name: Pytest diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q -m "not db"
