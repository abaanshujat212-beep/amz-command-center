name: Python diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  security-isolation:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: tests-S1, rules: S1}
          - {label: tests-S2, rules: S2}
          - {label: tests-S3, rules: S3}
          - {label: tests-S4, rules: S4}
          - {label: tests-S5, rules: S5}
          - {label: tests-S6, rules: S6}
          - {label: tests-S7, rules: S7}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check tests/test_amazon_contract_verification.py --select "${{ matrix.rules }}"

  pytest-diagnostic:
    name: Pytest diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q -m "not db"
