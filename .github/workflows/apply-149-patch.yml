name: Apply 149 patch

on:
  push:
    branches: [feat/149-action-capability-registry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/149-action-capability-registry
      - run: python .tmp/apply_149_patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/approval-decision.ts services/actions/worker.py
          git diff --cached --quiet || git commit -m "feat: enforce capability registry in approval and worker"
          git push
