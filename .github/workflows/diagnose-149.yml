name: Diagnose 149

on:
  push:
    branches: [feat/149-action-capability-registry]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/149-action-capability-registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: apps/web
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/ruff.log 2>&1
          (cd apps/web && npm run typecheck) > /tmp/web.log 2>&1
          {
            echo '=== RUFF ==='
            cat /tmp/ruff.log
            echo '=== WEB TYPECHECK ==='
            cat /tmp/web.log
          } > docs/.ci-149-diagnostics.txt
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/.ci-149-diagnostics.txt
          git commit -m "ci: record capability diagnostics"
          git push
