version: 2

models:
  - name: mart_sqp_opportunity
    description: Search Query Performance opportunity finder for query-level demand, conversion and harvest gaps.
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: asin
        tests: [not_null]
      - name: search_query
        tests: [not_null]
      - name: sqp_opportunity_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              severity: error
      - name: suggested_action
        tests:
          - accepted_values:
              values: [already_negative, harvest_exact, test_campaign, watch_spend, monitor]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tenant_id, asin, search_query]

  - name: mart_product_opportunity
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: asin
        tests: [not_null]
      - name: opportunity_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              severity: error
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tenant_id, asin]

  - name: mart_sku_economics
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: sku
        tests: [not_null]
      - name: break_even_acos
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: economics_incomplete
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tenant_id, sku]

  - name: mart_ppc_campaign_daily
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: acos
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: is_settled
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tenant_id, report_date, campaign_id]

  - name: mart_ppc_placement_daily
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: placement_entity_id
        tests: [not_null]
      - name: placement
        tests:
          - accepted_values:
              values: [top_of_search, product_page, rest_of_search, off_amazon]
              severity: warn
      - name: cvr
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: error
      - name: spend_share
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: error
      - name: is_settled
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tenant_id, report_date, campaign_id, placement]

  - name: mart_ppc_keyword_daily
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: keyword_id
        tests: [not_null]
      - name: verdict
        tests:
          - accepted_values:
              values: [strong, profitable, marginal, losing, no_sales, no_data, unknown]
      - name: ctr
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: error
      - name: cvr
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: error
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tenant_id, report_date, keyword_id]

  - name: mart_ppc_search_term_daily
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: search_term
        tests: [not_null]
      - name: is_already_negative
        tests: [not_null]
      - name: exists_as_exact
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tenant_id, report_date, campaign_id, ad_group_id, search_term, matched_keyword_id]
