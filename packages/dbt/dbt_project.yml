name: axaty
version: "1.0.0"
config-version: 2

profile: axaty

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Rules must never act on unsettled data. Everything downstream respects this.
  settlement_lag_days: 3
  ads_lookback_days: 95
  default_target_acos: 0.35
  reporting_timezone: "Europe/London"
  currency: "GBP"

# The copilot reads marts only through tenant-filtered views in the copilot
# schema (migration 0007). Rebuilding a mart drops the table and takes those
# views with it, so they have to be recreated at the end of every run.
#
# The existence check keeps a checkout where 0007 has not been applied yet from
# failing at the very end of a long build.
on-run-end:
  - "do $$ begin if exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'copilot' and p.proname = 'refresh_views') then perform copilot.refresh_views(); end if; end $$;"

models:
  axaty:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
