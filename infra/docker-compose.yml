name: axaty

services:
  postgres:
    image: postgres:16-alpine
    container_name: axaty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axaty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axaty}
      POSTGRES_DB: ${POSTGRES_DB:-axaty}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axaty} -d ${POSTGRES_DB:-axaty}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: axaty-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Metabase keeps its own application database. It must NEVER connect to the
  # analytics database as a superuser — create a read-only role for that.
  metabase-db:
    image: postgres:16-alpine
    container_name: axaty-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    volumes:
      - metabasedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: axaty-metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: metabase-db
      JAVA_TIMEZONE: Europe/London
    ports:
      - "3001:3000"

volumes:
  pgdata:
  redisdata:
  metabasedata:
